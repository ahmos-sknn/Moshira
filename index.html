
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>إلى مشيرة ❤️</title>

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    min-height: 100vh;
    font-family: Tahoma, Arial, sans-serif;
    background: linear-gradient(135deg, #3b102b, #8e315e, #e58a9e);
    color: white;
    text-align: center;
    overflow-x: hidden;
}

.container {
    position: relative;
    z-index: 1;
    width: 92%;
    max-width: 650px;
    margin: 35px auto;
    padding: 25px 18px;
    background: rgba(255,255,255,0.13);
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 25px;
    box-shadow: 0 10px 35px rgba(0,0,0,0.25);
    backdrop-filter: blur(10px);
}

h1 { font-size: 30px; margin-bottom: 12px; }

p { line-height: 2; font-size: 17px; }

input {
    width: 85%;
    max-width: 300px;
    padding: 13px;
    border: none;
    border-radius: 12px;
    text-align: center;
    font-size: 17px;
    margin: 12px 0;
}

button {
    border: none;
    border-radius: 25px;
    padding: 12px 25px;
    margin: 8px;
    background: #fff;
    color: #8e315e;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.3s;
}

button:hover {
    transform: scale(1.05);
    background: #ffe2eb;
}

.hidden { display: none !important; }

#story {
    font-size: 19px;
    line-height: 2.2;
    min-height: 100px;
    white-space: pre-line;
}

#puzzle {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 4px;
    width: min(90vw, 330px);
    aspect-ratio: 1 / 1;
    margin: 20px auto;
    border: 4px solid white;
    border-radius: 12px;
    overflow: hidden;
    background: white;
}

.piece {
    width: 100%;
    height: 100%;
    background-image: url("couple.jpg");
    background-size: 300% 300%;
    background-repeat: no-repeat;
    cursor: pointer;
    border: 1px solid rgba(255,255,255,0.5);
    min-width: 0;
    min-height: 0;
}

.piece.selected {
    outline: 4px solid #ffe1a8;
    outline-offset: -4px;
    opacity: 0.65;
}

#couplePhoto {
    display: block;
    width: 100%;
    max-width: 430px;
    height: auto;
    border-radius: 20px;
    margin: 20px auto;
    box-shadow: 0 8px 25px rgba(0,0,0,0.3);
}

#finalMessage {
    font-size: 20px;
    line-height: 2.2;
    margin-top: 20px;
    white-space: pre-line;
}

#musicFallback {
    background: #ffe2eb;
    color: #702044;
}

#showEndingButton {
    background: #ffe1a8;
    color: #702044;
}

.heart {
    position: fixed;
    bottom: -30px;
    color: #ffb6d0;
    font-size: 22px;
    pointer-events: none;
    animation: floatUp 7s linear forwards;
    z-index: 0;
}

@keyframes floatUp {
    0% { transform: translateY(0) rotate(0deg); opacity: 0; }
    15% { opacity: 1; }
    100% { transform: translateY(-110vh) rotate(360deg); opacity: 0; }
}
</style>
</head>

<body>

<audio id="music" src="music.mp3" loop preload="auto"></audio>

<div class="container" id="passwordScreen">
    <h1>إلى مشيرة ❤️</h1>
    <p>
        فيه مفاجأة صغيرة مستنياكي...
        <br>
        بس لازم تدخلي كلمة السر الأول 🌹
    </p>

    <input type="password" id="password"
           placeholder="كلمة السر" autocomplete="off">
    <br>

    <button onclick="checkPassword()">افتحي المفاجأة ❤️</button>
    <p id="error" style="color:#ffe0e0;"></p>
</div>

<div class="container hidden" id="mainScreen">

    <h1>مشيرة ❤️</h1>

    <p>
        فاكرة إن الحكايات الحلوة بتبدأ إزاي؟
        <br>
        أحيانًا بتبدأ من غير ما نخطط لها...
    </p>

    <div id="story"></div>

    <button id="nextButton" class="hidden" onclick="showPuzzle()">
        كمّلي المفاجأة ❤️
    </button>

    <div id="puzzleSection" style="display:none;">

        <h2>عندي ليكي تحدي صغير 🧩</h2>

        <p>
            رتّبي قطع الصورة عشان تشوفي المفاجأة.
            <br>
            اختاري قطعتين لتبديل مكانهما.
        </p>

        <div id="puzzle"></div>

        <p id="puzzleStatus">اختاري قطعتين من الصورة ❤️</p>

        <button id="showEndingButton" onclick="showEnding()">
            عرض المفاجأة ❤️
        </button>
    </div>

    <div id="ending" style="display:none;">

        <h2>وأخيرًا... ❤️</h2>

        <img id="couplePhoto" src="couple.jpg" alt="صورتنا">

        <div id="finalMessage"></div>

    </div>

    <button id="musicFallback" class="hidden" onclick="playMusic()">
        شغّلي الموسيقى 🎵
    </button>

</div>

<script>
const PASSWORD = "badbody";
const music = document.getElementById("music");

function checkPassword() {
    const entered = document.getElementById("password").value;

    if (entered === PASSWORD) {
        document.getElementById("passwordScreen").style.display = "none";
        document.getElementById("mainScreen").classList.remove("hidden");

        playMusic();
        startStory();
    } else {
        document.getElementById("error").textContent =
            "مش دي كلمة السر يا مشيرة 😉";
    }
}

function playMusic() {
    music.play().then(() => {
        document.getElementById("musicFallback").classList.add("hidden");
    }).catch(() => {
        document.getElementById("musicFallback").classList.remove("hidden");
    });
}

// Story
const storyText =
`يمكن مكنتش أعرف إن يوم عادي ممكن يتحول لحكاية مختلفة...

وإن مكالمة بسيطة ممكن تبقى بداية لحاجة جميلة.

بس فيه أشخاص وجودهم بيخلّي التفاصيل الصغيرة لها معنى تاني.

ومهما حاولت أوصفلك، هتفضل الكلمات أقل من اللي جوايا.

أنا مبسوط إنك بقيتي جزء من حكايتي يا مشيرة ❤️`;

let storyTimer = null;

function startStory() {
    const story = document.getElementById("story");
    let i = 0;

    story.textContent = "";

    if (storyTimer) clearInterval(storyTimer);

    storyTimer = setInterval(() => {
        story.textContent += storyText.charAt(i);
        i++;

        if (i >= storyText.length) {
            clearInterval(storyTimer);
            document.getElementById("nextButton").classList.remove("hidden");
        }
    }, 65);
}

// Show puzzle
function showPuzzle() {
    document.getElementById("nextButton").style.display = "none";
    document.getElementById("puzzleSection").style.display = "block";
    document.getElementById("ending").style.display = "none";

    createPuzzle();

    document.getElementById("puzzleSection").scrollIntoView({
        behavior: "smooth",
        block: "center"
    });
}

// Puzzle
let pieces = [];
let selectedPiece = null;
let puzzleFinished = false;

function createPuzzle() {
    const puzzle = document.getElementById("puzzle");
    puzzle.innerHTML = "";

    pieces = [0,1,2,3,4,5,6,7,8];

    // Shuffle the pieces
    for (let i = pieces.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [pieces[i], pieces[j]] = [pieces[j], pieces[i]];
    }

    // Avoid starting with an already solved puzzle
    if (pieces.every((value, index) => value === index)) {
        [pieces[0], pieces[1]] = [pieces[1], pieces[0]];
    }

    selectedPiece = null;
    puzzleFinished = false;

    pieces.forEach((pieceNumber, index) => {
        const piece = document.createElement("div");
        piece.className = "piece";
        setPieceImage(piece, pieceNumber);

        piece.addEventListener("click", () => selectPiece(index));

        puzzle.appendChild(piece);
    });

    document.getElementById("puzzleStatus").textContent =
        "اختاري قطعتين لتبديل مكانهما ❤️";
}

function setPieceImage(element, number) {
    const row = Math.floor(number / 3);
    const col = number % 3;

    element.style.backgroundPosition =
        `${col * 50}% ${row * 50}%`;
}

function selectPiece(index) {
    if (puzzleFinished) return;

    const allPieces = document.querySelectorAll("#puzzle .piece");

    if (selectedPiece === null) {
        selectedPiece = index;
        allPieces[index].classList.add("selected");
        return;
    }

    const first = selectedPiece;
    const second = index;

    if (first === second) {
        allPieces[index].classList.remove("selected");
        selectedPiece = null;
        return;
    }

    [pieces[first], pieces[second]] =
        [pieces[second], pieces[first]];

    selectedPiece = null;

    updatePuzzle();
    checkPuzzleSolved();
}

function updatePuzzle() {
    const allPieces = document.querySelectorAll("#puzzle .piece");

    allPieces.forEach((piece, index) => {
        piece.classList.remove("selected");
        setPieceImage(piece, pieces[index]);
    });
}

// Check solution
function checkPuzzleSolved() {
    const solved = pieces.every(
        (number, index) => number === index
    );

    if (solved && !puzzleFinished) {
        puzzleFinished = true;

        document.getElementById("puzzleStatus").textContent =
            "برافو يا مشيرة! عرفتي تحليها ❤️";

        showEnding();
    }
}

// Ending
let endingTimer = null;

function showEnding() {
    // Prevent repeated calls
    puzzleFinished = true;

    const puzzleSection = document.getElementById("puzzleSection");
    const ending = document.getElementById("ending");
    const target = document.getElementById("finalMessage");

    puzzleSection.style.display = "none";
    ending.style.display = "block";

    const photo = document.getElementById("couplePhoto");
    photo.style.display = "block";
    photo.src = "couple.jpg";

    const message =
`مشيرة...

يمكن أجمل حاجة في الحكاية دي
إني لقيت حد نفسي أشاركه تفاصيل أيامي.

ضحكتك، وجودك، وكلامك...
كلها حاجات بقيت غالية عندي.

أنا مش بوعدك إن كل يوم هيكون مثالي،
لكن بوعدك إني أكون صادق معاكي،
وأحاول أخلي أيامنا أحلى.

بحبك يا مشيرة ❤️`;

    if (endingTimer) clearInterval(endingTimer);

    target.textContent = "";

    let i = 0;

    endingTimer = setInterval(() => {
        target.textContent += message.charAt(i);
        i++;

        if (i >= message.length) {
            clearInterval(endingTimer);
        }
    }, 75);

    ending.scrollIntoView({
        behavior: "smooth",
        block: "center"
    });
}

// Floating hearts
function createHeart() {
    const heart = document.createElement("div");
    heart.className = "heart";

    heart.textContent = ["❤️", "💕", "💗", "💖", "🌹"][
        Math.floor(Math.random() * 5)
    ];

    heart.style.left = Math.random() * 100 + "vw";
    heart.style.animationDuration = (5 + Math.random() * 5) + "s";

    document.body.appendChild(heart);

    setTimeout(() => heart.remove(), 10000);
}

setInterval(createHeart, 650);
</script>

</body>
</html>
